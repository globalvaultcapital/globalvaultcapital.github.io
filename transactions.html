<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Vault | Transactions</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #06111d;
    color: #ffffff;
    min-height: 100vh;
}

/* HEADER */
.header {
    height: 82px;
    background: #050b12;
    border-bottom: 1px solid rgba(216,137,24,0.18);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.menu-button {
    font-size: 31px;
    color: #ffc857;
    cursor: pointer;
    line-height: 1;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 24px;
}

.notification {
    position: relative;
    font-size: 27px;
    color: #ffffff;
}

.notification-dot {
    position: absolute;
    width: 9px;
    height: 9px;
    background: #ffc857;
    border-radius: 50%;
    top: 1px;
    right: -2px;
    box-shadow: 0 0 8px rgba(255,200,87,0.8);
}

.profile {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #d88918;
    color: #06111d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}

/* MAIN */
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 38px 20px 100px;
}

.page-title {
    font-size: 35px;
    margin-bottom: 12px;
    font-weight: 700;
}

.page-subtitle {
    color: #aab4bf;
    font-size: 17px;
    margin-bottom: 42px;
}

/* TRANSACTION CARD */
.transaction-card {
    background: #050b12;
    border: 1px solid rgba(216,137,24,0.12);
    border-radius: 22px;
    min-height: 330px;
    padding: 28px 25px;
    box-shadow:
        0 0 25px rgba(216,137,24,0.03),
        inset 0 0 35px rgba(216,137,24,0.02);
}

/* TABS */
.tabs {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 75px;
    overflow-x: auto;
}

.tab {
    border: none;
    background: transparent;
    color: #aab4bf;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 20px;
    border-radius: 14px;
    cursor: pointer;
    white-space: nowrap;
}

.tab.active {
    background: #30343a;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(216,137,24,0.08);
}

.tab:hover {
    color: #ffc857;
}

/* EMPTY STATE */
.empty-state {
    text-align: center;
    color: #aab4bf;
    font-size: 18px;
    padding-bottom: 25px;
}

/* FLOATING CHAT */
.chat-button {
    position: fixed;
    right: 20px;
    bottom: 25px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #d88918;
    color: #06111d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    box-shadow:
        0 0 15px rgba(216,137,24,0.65),
        0 0 35px rgba(216,137,24,0.25);
    z-index: 1000;
}

/* SIDE MENU */
.sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 290px;
    height: 100vh;
    background: #050b12;
    border-right: 1px solid rgba(216,137,24,0.2);
    padding: 25px 20px;
    z-index: 2000;
    transition: left 0.3s ease;
    overflow-y: auto;
}

.sidebar.open {
    left: 0;
}

.sidebar-title {
    color: #ffc857;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 35px;
}

.close-menu {
    position: absolute;
    top: 22px;
    right: 20px;
    font-size: 25px;
    color: #ffffff;
    cursor: pointer;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 16px 10px;
    color: #ffffff;
    text-decoration: none;
    border-radius: 10px;
    margin-bottom: 5px;
    font-size: 16px;
}

.menu-item:hover {
    background: rgba(216,137,24,0.08);
    color: #ffc857;
}

.menu-icon {
    width: 25px;
    text-align: center;
    color: #ffc857;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 1500;
}

.overlay.show {
    display: block;
}

/* MOBILE */
@media (max-width: 600px) {

    .header {
        height: 78px;
        padding: 0 20px;
    }

    .container {
        padding: 34px 20px 100px;
    }

    .page-title {
        font-size: 34px;
    }

    .page-subtitle {
        font-size: 17px;
        line-height: 1.45;
    }

    .transaction-card {
        padding: 28px 18px;
        min-height: 330px;
    }

    .tabs {
        gap: 4px;
        margin-bottom: 72px;
    }

    .tab {
        font-size: 17px;
        padding: 13px 16px;
    }

    .chat-button {
        right: 18px;
        bottom: 20px;
        width: 58px;
        height: 58px;
    }
}
</style>
</head>

<body>

<!-- SIDE MENU -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="sidebar">

    <div class="close-menu" onclick="closeMenu()">×</div>

    <div class="sidebar-title">
        GLOBAL VAULT
    </div>

    <a href="dashboard.html" class="menu-item">
        <span class="menu-icon">▦</span>
        <span>Dashboard</span>
    </a>

    <a href="deposit.html" class="menu-item">
        <span class="menu-icon">↓</span>
        <span>Deposit Funds</span>
    </a>

    <a href="withdraw.html" class="menu-item">
        <span class="menu-icon">↑</span>
        <span>Withdraw Funds</span>
    </a>

    <a href="trading.html" class="menu-item">
        <span class="menu-icon">⌁</span>
        <span>Trade Center</span>
    </a>

    <a href="tesla.html" class="menu-item">
        <span class="menu-icon">ϟ</span>
        <span>Tesla Investment</span>
    </a>

    <a href="transactions.html" class="menu-item">
        <span class="menu-icon">◷</span>
        <span>Transactions</span>
    </a>

    <a href="investment-plan.html" class="menu-item">
        <span class="menu-icon">▱</span>
        <span>Investment Plans</span>
    </a>

    <a href="stocks.html" class="menu-item">
        <span class="menu-icon">▤</span>
        <span>Stock Investments</span>
    </a>

</div>

<!-- HEADER -->
<header class="header">

    <div class="menu-button" onclick="openMenu()">
        ☰
    </div>

    <div class="header-right">

        <div class="notification">
            ♧
            <span class="notification-dot"></span>
        </div>

        <div class="profile">
            R
        </div>

    </div>

</header>

<!-- MAIN CONTENT -->
<main class="container">

    <h1 class="page-title">
        Transaction History
    </h1>

    <p class="page-subtitle">
        All your deposits, withdrawals, and trades.
    </p>

    <div class="transaction-card">

        <div class="tabs">

            <button class="tab active" onclick="showTab('deposits', this)">
                Deposits
            </button>

            <button class="tab" onclick="showTab('withdrawals', this)">
                Withdrawals
            </button>

            <button class="tab" onclick="showTab('trades', this)">
                Trades
            </button>

        </div>

        <div class="empty-state" id="emptyMessage">
            No records.
        </div>

    </div>

</main>

<script>

/* MENU */
function openMenu() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("show");
}

function closeMenu() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
}

/* TRANSACTION TABS */
function showTab(type, button) {

    document.querySelectorAll(".tab").forEach(function(tab) {
        tab.classList.remove("active");
    });

    button.classList.add("active");

    document.getElementById("emptyMessage").textContent = "No records.";
}

/* CHAT */
function openChat() {
    alert("Global Vault Support\n\nHow can we help you today?");
}

</script>
<!-- GLOBAL VAULT SUPPORT CHAT -->
<div id="gvChatButton" onclick="openGVChat()">💬</div>

<div id="gvChatBox">
    <div class="gv-chat-header">
        <strong>Global Vault Support</strong>
        <button onclick="closeGVChat()">×</button>
    </div>

    <div class="gv-chat-body">
        <input id="gvName" type="text" placeholder="Your name">
        <input id="gvEmail" type="email" placeholder="Your email">
        <textarea id="gvMessage" placeholder="How can we help?"></textarea>

        <button onclick="sendGVMessage()">Send Message</button>

        <p id="gvStatus"></p>
    </div>
</div>

<style>
#gvChatButton {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #d88918;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    cursor: pointer;
    z-index: 99999;
    box-shadow: 0 0 18px rgba(216,137,24,.45);
}

#gvChatBox {
    position: fixed;
    right: 18px;
    bottom: 82px;
    width: 310px;
    max-width: calc(100% - 36px);
    background: #07111c;
    border: 1px solid rgba(216,137,24,.45);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
    z-index: 100000;
    display: none;
}

.gv-chat-header {
    background: #d88918;
    color: white;
    padding: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.gv-chat-header button {
    background: none;
    border: none;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.gv-chat-body {
    padding: 14px;
}

.gv-chat-body input,
.gv-chat-body textarea {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
    padding: 11px;
    background: #0b1825;
    border: 1px solid rgba(216,137,24,.25);
    border-radius: 7px;
    color: white;
    outline: none;
}

.gv-chat-body textarea {
    height: 90px;
    resize: none;
}

.gv-chat-body button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 7px;
    background: #d88918;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#gvStatus {
    text-align: center;
    font-size: 12px;
    margin: 8px 0 0;
    color: #ffc857;
}
</style>

<script>
function openGVChat() {
    document.getElementById("gvChatBox").style.display = "block";
}

function closeGVChat() {
    document.getElementById("gvChatBox").style.display = "none";
}

async function sendGVMessage() {
    const name = document.getElementById("gvName").value.trim();
    const email = document.getElementById("gvEmail").value.trim();
    const message = document.getElementById("gvMessage").value.trim();
    const status = document.getElementById("gvStatus");

    if (!name || !email || !message) {
        status.textContent = "Please fill in all fields.";
        return;
    }

    status.textContent = "Sending...";

    try {
        const response = await fetch(
            "https://nudqvqvbdaszyfxnzgbt.supabase.co/functions/v1/send-support-message",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    message: message
                })
            }
        );

        if (!response.ok) {
            throw new Error("Failed");
        }

        status.textContent = "Message sent successfully.";

        document.getElementById("gvName").value = "";
        document.getElementById("gvEmail").value = "";
        document.getElementById("gvMessage").value = "";

    } catch (error) {
        status.textContent = "Unable to send message.";
    }
}
</script>
</body>
</html>
