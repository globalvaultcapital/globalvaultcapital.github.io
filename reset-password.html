<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Vault - Reset Password</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            background:
                radial-gradient(circle at 50% 100%, rgba(216, 137, 24, 0.16), transparent 45%),
                radial-gradient(circle at 0% 50%, rgba(216, 137, 24, 0.06), transparent 35%),
                #030303;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .brand {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-top: 100px;
            letter-spacing: -1px;
        }

        .brand span {
            color: #d88918;
            text-shadow:
                0 0 8px rgba(216, 137, 24, 0.45),
                0 0 20px rgba(216, 137, 24, 0.18);
        }

        .reset-card {
            width: 90%;
            max-width: 320px;
            margin: 35px auto 20px;
            padding: 22px;
            box-sizing: border-box;
            background: rgba(8, 8, 8, 0.96);
            border: 1px solid rgba(216, 137, 24, 0.25);
            border-radius: 10px;
            box-shadow:
                0 0 12px rgba(216, 137, 24, 0.18),
                0 0 35px rgba(216, 137, 24, 0.08),
                inset 0 0 25px rgba(216, 137, 24, 0.03);
        }

        .reset-card h1 {
            margin: 0 0 10px;
            font-size: 22px;
            line-height: 1.1;
            text-align: center;
        }

        .intro {
            margin: 0 0 20px;
            color: #777;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-top: 12px;
            background: #080808;
            border: 1px solid rgba(216, 137, 24, 0.25);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .input-group span {
            margin-right: 10px;
            font-size: 13px;
            opacity: 0.7;
        }

        .input-group input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 12px;
        }

        .input-group input::placeholder {
            color: #777;
        }

        .reset-button {
            width: 100%;
            margin-top: 18px;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #d88918;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(216, 137, 24, 0.25);
        }

        .reset-button:hover {
            background: #e49727;
        }

        .back-login {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #d88918;
            text-decoration: none;
            font-size: 11px;
        }

        .security-message {
            margin-top: 14px;
            text-align: center;
            color: #777;
            font-size: 10px;
        }

        /* POPUP */

        .gv-popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            padding: 20px;
        }

        .gv-popup-card {
            width: 100%;
            max-width: 340px;
            background: #080808;
            border: 1px solid rgba(216, 137, 24, 0.45);
            border-radius: 12px;
            padding: 30px 22px;
            text-align: center;
            box-shadow:
                0 0 20px rgba(216, 137, 24, 0.20),
                0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .gv-popup-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(216, 137, 24, 0.12);
            border: 1px solid rgba(216, 137, 24, 0.40);
            color: #d88918;
            font-size: 28px;
        }

        .gv-popup-card h2 {
            margin: 0 0 12px;
            font-size: 20px;
            color: white;
        }

        .gv-popup-card p {
            margin: 0 auto 22px;
            color: #999;
            font-size: 12px;
            line-height: 1.6;
        }

        .gv-popup-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #d88918;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="brand">
        GLOBAL <span>VAULT</span>
    </div>

    <div class="reset-card">

        <h1>Reset Password</h1>

        <p class="intro">
            Create a new secure password for your Global Vault account.
        </p>

        <div class="input-group">
            <span>🔒</span>
            <input
                id="newPassword"
                type="password"
                placeholder="New Password"
            >
        </div>

        <div class="input-group">
            <span>🔒</span>
            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm New Password"
            >
        </div>

        <button class="reset-button" onclick="updatePassword()">
            UPDATE PASSWORD
        </button>

        <div class="security-message">
            🔒 Your information is protected and secure.
        </div>

        <a href="login.html" class="back-login">
            ← Back to Login
        </a>

    </div>

    <!-- POPUP -->

    <div id="gvPopup" class="gv-popup-overlay">

        <div class="gv-popup-card">

            <div id="gvPopupIcon" class="gv-popup-icon">
                ✓
            </div>

            <h2 id="gvPopupTitle">
                Password Updated
            </h2>

            <p id="gvPopupMessage">
                Your password has been updated successfully.
            </p>

            <button onclick="closeGVPopup()">
                OK
            </button>

        </div>

    </div>

    <script>

        const SUPABASE_URL =
            "https://nudqvqvbdaszyfxnzgbt.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_H2gi3HuTBmhfopOdh5grqw_jZl5v0jc";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        async function updatePassword() {

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (!newPassword || !confirmPassword) {

                showGVPopup(
                    "Missing Information",
                    "Please enter and confirm your new password.",
                    "!"
                );

                return;
            }


            if (newPassword.length < 8) {

                showGVPopup(
                    "Password Too Short",
                    "Your password must be at least 8 characters long.",
                    "!"
                );

                return;
            }


            if (newPassword !== confirmPassword) {

                showGVPopup(
                    "Passwords Do Not Match",
                    "Please make sure both passwords are exactly the same.",
                    "!"
                );

                return;
            }


            const { error } =
                await supabaseClient.auth.updateUser({
                    password: newPassword
                });


            if (error) {

                showGVPopup(
                    "Unable to Update Password",
                    error.message,
                    "!"
                );

                return;
            }


            showGVPopup(
                "Password Updated!",
                "Your password has been changed successfully. You can now log in with your new password.",
                "✓"
            );

        }


        function showGVPopup(title, message, icon = "✓") {

            document.getElementById("gvPopupTitle").textContent =
                title;

            document.getElementById("gvPopupMessage").textContent =
                message;

            document.getElementById("gvPopupIcon").textContent =
                icon;

            document.getElementById("gvPopup").style.display =
                "flex";
        }


        function closeGVPopup() {

            document.getElementById("gvPopup").style.display =
                "none";

        }

    </script>

</body>
</html>
