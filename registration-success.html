<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Vault - Registration Successful</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 100%,
                    rgba(216, 137, 24, 0.16),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 0% 50%,
                    rgba(216, 137, 24, 0.06),
                    transparent 35%
                ),
                #030303;

            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .brand {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 25px;
        }

        .brand span {
            color: #d88918;

            text-shadow:
                0 0 8px rgba(216, 137, 24, 0.45),
                0 0 20px rgba(216, 137, 24, 0.18);
        }

        .success-card {
            width: 100%;
            max-width: 380px;

            padding: 35px 25px;

            text-align: center;

            background: rgba(8, 8, 8, 0.96);

            border: 1px solid rgba(216, 137, 24, 0.30);

            border-radius: 12px;

            box-shadow:
                0 0 15px rgba(216, 137, 24, 0.18),
                0 0 40px rgba(216, 137, 24, 0.08),
                inset 0 0 25px rgba(216, 137, 24, 0.03);
        }

        .success-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(216, 137, 24, 0.12);

            border: 1px solid rgba(216, 137, 24, 0.45);

            color: #d88918;

            font-size: 30px;

            box-shadow:
                0 0 20px rgba(216, 137, 24, 0.20);
        }

        .success-card h1 {
            margin: 0 0 12px;

            font-size: 24px;

            color: white;
        }

        .success-card p {
            margin: 0 auto 25px;

            max-width: 300px;

            color: #999;

            font-size: 13px;

            line-height: 1.6;
        }

        .login-button {
            display: block;

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #d88918;

            color: white;

            font-size: 13px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            box-shadow:
                0 0 15px rgba(216, 137, 24, 0.25);

            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #e49727;

            box-shadow:
                0 0 22px rgba(216, 137, 24, 0.40);
        }

        .security-message {
            margin-top: 18px;

            color: #666;

            font-size: 10px;
        }
    </style>
</head>

<body>

    <div class="brand">
        GLOBAL <span>VAULT</span>
    </div>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>Registration Successful!</h1>

        <p>
            Your email has been successfully confirmed.
            Your Global Vault account is now ready.
        </p>

        <a href="login.html" class="login-button">
            LOGIN
        </a>

        <div class="security-message">
            🔒 Your information is protected and secure.
        </div>

    </div>

</body>
</html>
